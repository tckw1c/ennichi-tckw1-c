<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>1年C組｜縁日謎解き</title>


  <style>

    /* =========================
       全体
    ========================= */

    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      font-family:
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        sans-serif;

      color: #17395c;

      background:
        radial-gradient(
          circle,
          rgba(255,255,255,0.15) 2px,
          transparent 2px
        ) 0 0 / 35px 35px,

        linear-gradient(
          160deg,
          #07519a,
          #0780c9,
          #65c9ed
        );

      min-height: 100vh;
    }


    /* =========================
       提灯
    ========================= */

    .lanterns {
      display: flex;

      justify-content: center;

      gap: 14px;

      padding: 15px 10px 5px;

      overflow: hidden;
    }


    .lantern {
      width: 42px;
      height: 58px;

      background:
        linear-gradient(
          90deg,
          #f04c61,
          #ff8b78,
          #f04c61
        );

      border-radius:
        45% 45% 50% 50%;

      box-shadow:
        0 0 18px
        rgba(255, 220, 90, 0.8);

      position: relative;

      flex-shrink: 0;
    }


    .lantern::before,
    .lantern::after {
      content: "";

      position: absolute;

      left: 7px;
      right: 7px;

      height: 3px;

      background: #fff3c2;
    }


    .lantern::before {
      top: 9px;
    }


    .lantern::after {
      bottom: 9px;
    }


    /* =========================
       ヘッダー
    ========================= */

    header {
      width:
        min(900px, calc(100% - 30px));

      margin: 15px auto 0;

      padding:
        35px 20px 30px;

      text-align: center;

      background: #fff9eb;

      border:
        5px solid #ffd65a;

      border-radius: 25px;

      box-shadow:
        0 12px 35px
        rgba(0, 35, 85, 0.35);

      position: relative;
    }


    header::before,
    header::after {
      content: "";

      position: absolute;

      width: 60px;
      height: 60px;

      background: #e9435f;

      border-radius: 50%;

      z-index: 0;
    }


    header::before {
      left: -25px;
      top: -25px;
    }


    header::after {
      right: -25px;
      top: -25px;
    }


    /* =========================
       ロゴ
    ========================= */

    .logo {
      width: 150px;
      height: 150px;

      object-fit: contain;

      display: block;

      margin:
        0 auto 15px;

      background: #07549d;

      border-radius: 18px;

      padding: 8px;

      box-shadow:
        0 6px 0 #043768;

      position: relative;

      z-index: 1;
    }


    /* =========================
       クラス名
    ========================= */

    .class-name {
      display: inline-block;

      background: #0b5cab;

      color: white;

      padding:
        6px 18px;

      border-radius: 50px;

      font-weight: bold;

      letter-spacing:
        0.12em;

      position: relative;

      z-index: 1;
    }


    /* =========================
       タイトル
    ========================= */

    h1 {
      margin:
        15px 0 5px;

      color: #063b78;

      font-size:
        clamp(2rem, 7vw, 4rem);

      letter-spacing:
        0.08em;

      text-shadow:
        2px 3px 0 #b9e8ff;

      position: relative;

      z-index: 1;
    }


    .subtitle {
      margin: 0;

      color: #38617e;

      font-weight: bold;

      position: relative;

      z-index: 1;
    }


    /* =========================
       メイン
    ========================= */

    main {
      width:
        min(900px, calc(100% - 30px));

      margin:
        25px auto 50px;
    }


    /* =========================
       カード
    ========================= */

    .card {
      background:
        rgba(255,255,255,0.97);

      border-radius: 20px;

      padding: 25px;

      margin-bottom: 20px;

      border:
        3px solid #ffd65a;

      box-shadow:
        0 9px 25px
        rgba(0,39,88,0.25);
    }


    /* =========================
       見出し
    ========================= */

    .card h2 {
      margin-top: 0;

      color: #063b78;

      font-size: 1.5rem;

      display: flex;

      align-items: center;

      gap: 10px;
    }


    .card h2::before {
      content: "祭";

      display: grid;

      place-items: center;

      width: 40px;
      height: 40px;

      background: #e9435f;

      color: white;

      border-radius: 9px;

      font-size: 1rem;

      flex-shrink: 0;
    }


    /* =========================
       説明
    ========================= */

    .notice {
      background: #e8f7ff;

      border-left:
        7px solid #0b5cab;

      padding: 15px;

      border-radius: 8px;

      line-height: 1.8;
    }


    /* =========================
       遊び方
    ========================= */

    .steps {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 12px;

      margin-top: 15px;
    }


    .step {
      padding: 18px;

      background:
        linear-gradient(
          145deg,
          #f3fbff,
          #dff4ff
        );

      border-radius: 14px;

      text-align: center;

      border:
        2px dashed #54b5e8;
    }


    .step strong {
      display: block;

      color: #0b5cab;

      margin-bottom: 5px;
    }


    /* =========================
       謎の画像
    ========================= */

    .puzzle {
      background: #ffffff;

      border:
        3px solid #ff668c;

      border-radius: 16px;

      padding: 15px;

      text-align: center;
    }


    .puzzle-image {
      width: 100%;

      max-width: 850px;

      height: auto;

      display: block;

      margin:
        0 auto 20px;

      border-radius: 8px;
    }


    /* =========================
       答え入力
    ========================= */

    .answer-title {
      font-weight: bold;

      font-size: 1.15rem;

      margin:
        10px 0;
    }


    .answer-note {
      margin:
        0 0 10px;

      color: #555;

      font-size: 0.95rem;

      font-weight: bold;
    }


    .answer-row {
      display: flex;

      gap: 10px;

      max-width: 550px;

      margin: auto;
    }


    input {
      width: 100%;

      padding: 14px;

      border:
        2px solid #9ccde7;

      border-radius: 12px;

      font-size: 1rem;

      outline: none;
    }


    input:focus {
      border-color: #0b5cab;

      box-shadow:
        0 0 0 3px #c9edff;
    }


    /* =========================
       ボタン
    ========================= */

    button {
      border: none;

      border-radius: 12px;

      padding:
        13px 22px;

      background: #e9435f;

      color: white;

      font-size: 1rem;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 4px 0 #a82e45;

      white-space: nowrap;

      transition:
        0.15s;
    }


    button:hover {
      filter: brightness(1.1);

      transform:
        translateY(-1px);
    }


    button:active {
      transform:
        translateY(2px);

      box-shadow:
        0 2px 0 #a82e45;
    }


    /* =========================
       答えの結果
    ========================= */

    #result {
      min-height: 25px;

      margin-top: 15px;

      font-weight: bold;

      font-size: 1.1rem;
    }


    .correct {
      color: #0b8a59;
    }


    .wrong {
      color: #d4314e;
    }


    /* =========================
       次の謎ボタン
    ========================= */

    #nextButton {
      display: none;

      margin:
        20px auto 5px;

      background:
        linear-gradient(
          135deg,
          #0879c9,
          #07519a
        );

      font-size: 1.1rem;

      padding:
        15px 30px;

      box-shadow:
        0 5px 0 #043768;

      animation:
        nextAppear 0.5s ease;
    }


    #nextButton:hover {
      background:
        linear-gradient(
          135deg,
          #1594e5,
          #0868b9
        );
    }


    @keyframes nextAppear {

      from {
        opacity: 0;

        transform:
          translateY(10px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }


    /* =========================
       ヒント
    ========================= */

    .hint-box {
      display: none;

      margin-top: 18px;

      padding: 16px;

      background: #e8f7ff;

      border-left:
        6px solid #0b5cab;

      border-radius: 10px;

      line-height: 1.8;

      animation:
        hintAppear 0.4s ease;
    }


    @keyframes hintAppear {

      from {
        opacity: 0;

        transform:
          translateY(-10px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0);
      }

    }


    /* =========================
       Give Up
    ========================= */

    .giveup-card {
      background: #fff7f7;

      border:
        3px solid #e9435f;
    }


    .giveup-content {
      text-align: center;
    }


    .giveup-title {
      margin:
        0 0 8px;

      color: #c8324d;

      font-size: 1.4rem;

      font-weight: bold;
    }


    .giveup-text {
      margin:
        0 0 18px;

      color: #555;

      line-height: 1.7;
    }


    .giveup-button {
      display: inline-block;

      padding:
        13px 35px;

      background: white;

      color: #d4314e;

      border:
        3px solid #d4314e;

      border-radius: 12px;

      text-decoration: none;

      font-weight: bold;

      font-size: 1.05rem;

      box-shadow:
        0 4px 0 #a82e45;

      transition:
        0.15s;
    }


    .giveup-button:hover {
      background: #d4314e;

      color: white;

      transform:
        translateY(-1px);
    }


    .giveup-button:active {
      transform:
        translateY(2px);

      box-shadow:
        0 2px 0 #a82e45;
    }


    /* =========================
       フッター
    ========================= */

    footer {
      text-align: center;

      color: white;

      padding-bottom: 30px;

      font-weight: bold;

      text-shadow:
        0 1px 3px #034071;
    }


    /* =========================
       スマホ対応
    ========================= */

    @media (max-width: 650px) {

      .lanterns {
        gap: 7px;
      }


      .lantern {
        width: 32px;

        height: 47px;
      }


      .logo {
        width: 125px;

        height: 125px;
      }


      header {
        padding:
          28px 17px 23px;
      }


      .steps {
        grid-template-columns: 1fr;
      }


      .answer-row {
        flex-direction: column;
      }


      button {
        width: 100%;
      }


      .puzzle {
        padding: 8px;
      }


      .puzzle-image {
        margin-bottom: 15px;
      }


      .giveup-button {
        width: 100%;

        text-align: center;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       提灯
  ========================= -->

  <div class="lanterns">

    <div class="lantern"></div>
    <div class="lantern"></div>
    <div class="lantern"></div>
    <div class="lantern"></div>
    <div class="lantern"></div>
    <div class="lantern"></div>
    <div class="lantern"></div>
    <div class="lantern"></div>
    <div class="lantern"></div>

  </div>



  <!-- =========================
       ヘッダー
  ========================= -->

  <header>

    <img
      class="logo"
      src="logo.jpg"
      alt="1年C組のロゴ"
    >


    <div class="class-name">
      文化祭・1年C組
    </div>


    <h1>
      縁日謎解き
    </h1>


    <p class="subtitle">
      屋台の合間に、ひとつ謎を解いていこう！
    </p>

  </header>



  <main>


    <!-- =========================
         遊び方
    ========================= -->

    <section class="card">

      <h2>
        遊び方
      </h2>


      <div class="notice">

        縁日を楽しみながら、
        謎を見つけて答えを入力しよう！

        <br>

        正解すると
        次の謎へ進むことができます！

      </div>


      <div class="steps">


        <div class="step">

          <strong>
            其の一
          </strong>

          謎を読む

        </div>


        <div class="step">

          <strong>
            其の二
          </strong>

          答えを考える

        </div>


        <div class="step">

          <strong>
            其の三
          </strong>

          答えを入力！

        </div>


      </div>

    </section>



    <!-- =========================
         第一の謎
    ========================= -->

    <section class="card">

      <h2>
        第一の謎
      </h2>


      <div class="puzzle">


        <!-- 謎の画像 -->

        <img
          class="puzzle-image"
          src="puzzle1.png"
          alt="第一の謎"
        >


        <p class="answer-title">
          答えを入力してください
        </p>


        <p class="answer-note">
          ※ひらがな・漢字どちらでも可
        </p>


        <div class="answer-row">


          <input
            id="answer"
            type="text"
            placeholder="答えを入力"
            autocomplete="off"
          >


          <button
            onclick="checkAnswer()"
          >
            答え合わせ
          </button>


        </div>


        <!-- 答えの結果 -->

        <p id="result"></p>


        <!-- =========================
             次の謎へ進むボタン
        ========================= -->

        <button
          id="nextButton"
          onclick="goToNextQuestion()"
        >
          次の謎に進む →
        </button>


      </div>

    </section>



    <!-- =========================
         ヒント
    ========================= -->

    <section class="card">

      <h2>
        ヒント
      </h2>


      <button
        id="hintButton"
        onclick="showHint()"
      >
        ヒントを表示する
      </button>


      <div
        id="hint"
        class="hint-box"
      >

        この教室を見渡すと...?

      </div>

    </section>



    <!-- =========================
         Give Up
    ========================= -->

    <section class="card giveup-card">


      <div class="giveup-content">


        <p class="giveup-title">
          😵 Give Up？
        </p>


        <p class="giveup-text">

          どうしても答えが分からないときは、
          解説を見ることができます。

          <br>

          あきらめる場合は下のボタンを押してください。

        </p>


        <a
          href="question1-explanation.html"
          class="giveup-button"
        >
          Give Up
        </a>


      </div>


    </section>


  </main>



  <!-- =========================
       フッター
  ========================= -->

  <footer>

    一緒に文化祭を盛り上げよう！

    <br>

    1年C組 縁日謎解き

  </footer>



  <!-- =========================
       JavaScript
  ========================= -->

  <script>


    /* =========================
       答え合わせ
    ========================= */

    function checkAnswer() {


      const input =
        document.getElementById("answer");


      const result =
        document.getElementById("result");


      const nextButton =
        document.getElementById("nextButton");


      /*
       * 入力された答え
       */

      const answer =
        input.value
          .trim()
          .replace(/\s/g, "");


      /*
       * 正解
       *
       * 「わたがし」
       * 「綿菓子」
       */

      if (
        answer === "わたがし" ||
        answer === "綿菓子"
      ) {


        result.textContent =
          "🎉 正解！ お見事！";


        result.className =
          "correct";


        /*
         * 次の謎へ進むボタンを表示
         */

        nextButton.style.display =
          "block";


      }


      /*
       * 空欄
       */

      else if (
        answer === ""
      ) {


        result.textContent =
          "答えを入力してね！";


        result.className =
          "wrong";


        nextButton.style.display =
          "none";


      }


      /*
       * 不正解
       */

      else {


        result.textContent =
          "❌ 残念！ もう一度考えてみよう。";


        result.className =
          "wrong";


        nextButton.style.display =
          "none";

      }

    }



    /* =========================
       次の謎へ進む
    ========================= */

    function goToNextQuestion() {


      /*
       * 第2問のページへ移動
       */

      window.location.href =
        "question2.html";

    }



    /* =========================
       ヒントを表示
    ========================= */

    function showHint() {


      const hint =
        document.getElementById("hint");


      const button =
        document.getElementById("hintButton");


      /*
       * ヒントを表示
       */

      hint.style.display =
        "block";


      /*
       * ボタンの文字を変更
       */

      button.textContent =
        "ヒントを閉じる";


      /*
       * 次に押したら閉じる
       */

      button.onclick =
        hideHint;

    }



    /* =========================
       ヒントを閉じる
    ========================= */

    function hideHint() {


      const hint =
        document.getElementById("hint");


      const button =
        document.getElementById("hintButton");


      /*
       * ヒントを非表示
       */

      hint.style.display =
        "none";


      /*
       * ボタンの文字を戻す
       */

      button.textContent =
        "ヒントを表示する";


      /*
       * 次に押したら表示する
       */

      button.onclick =
        showHint;

    }



    /* =========================
       Enterキーで答え合わせ
    ========================= */

    document
      .getElementById("answer")
      .addEventListener(
        "keydown",
        function(event) {


          if (
            event.key === "Enter"
          ) {


            checkAnswer();

          }

        }
      );


  </script>


</body>

</html>
